services:
  converter:
    build: ./service
    environment:
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    networks: [isolated]
  gateway:
    image: nginx:stable-alpine
    user: "10001:10001"
    depends_on: [converter]
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./service/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [isolated, frontend]
networks:
  frontend:
  isolated:
    internal: true
